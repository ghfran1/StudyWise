<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>StudyWise AI</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"><style>
:root{--bg:#f5f7fa;--card:#fff;--tx:#1e293b;--mu:#64748b;--pr:#1f3a5f;--pr2:#2f7f86;--ok:#2f855a;--bad:#c0392b;--wa:#b7791f;--bd:#e3e8ef;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e141f;--card:#151d2b;--tx:#e8edf5;--mu:#94a3b8;--bd:#243044;--pr:#5a86c0;--pr2:#3f8f94}}
:root[data-theme="dark"]{--bg:#0e141f;--card:#151d2b;--tx:#e8edf5;--mu:#94a3b8;--bd:#243044;--pr:#5a86c0;--pr2:#3f8f94}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#nav{position:fixed;z-index:5;background:var(--card);border:1px solid var(--bd);display:flex;gap:4px;left:0;right:0;bottom:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around}
#nav button{flex:1;background:none;border:0;color:var(--mu);font:inherit;font-size:12px;padding:6px;border-radius:12px;cursor:pointer}#nav button b{display:block;font-size:20px}#nav .on{color:var(--pr);background:color-mix(in srgb,var(--pr) 12%,transparent)}
#main{max-width:980px;margin:0 auto;padding:18px 14px 100px}
@media(min-width:800px){#nav{top:0;bottom:auto;right:auto;width:170px;height:100%;flex-direction:column;justify-content:flex-start;padding:20px 10px}#nav button{flex:0;text-align:left;font-size:14px}#nav button b{display:inline;margin-right:8px}#main{margin-left:190px;padding-bottom:40px;max-width:1100px}}
body.auth #main{margin:0 auto;padding-bottom:20px}
h1{font-size:24px;margin:4px 0 14px}h2{font-size:18px;margin:22px 0 10px}h3{font-size:15px;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:12px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.04)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
.btn{background:var(--pr);color:#fff;border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.g{background:none;color:var(--pr);border:1px solid var(--bd)}.btn.s{padding:6px 12px;font-size:13px}.btn.r{background:var(--bad)}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px;margin:4px 0 10px}textarea{min-height:80px}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:99px;padding:2px 10px;background:color-mix(in srgb,var(--pr) 14%,transparent);color:var(--pr)}.pill.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}.pill.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}.pill.wa{background:color-mix(in srgb,var(--wa) 18%,transparent);color:#b77900}
.bar{height:8px;border-radius:9px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pr),var(--pr2));border-radius:9px}.bar i.ok{background:var(--ok)}.bar i.bad{background:var(--bad)}
.mu{color:var(--mu);font-size:13px}.tabs{display:flex;gap:6px;overflow-x:auto;margin:12px 0}.tabs button{white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}.tabs .on{background:var(--pr);color:#fff;border-color:var(--pr)}
.stat{text-align:center}.stat b{font-size:26px;display:block}.opt{display:block;width:100%;text-align:left;background:var(--bg);border:2px solid var(--bd);color:var(--tx);border-radius:12px;padding:10px 12px;margin:6px 0;font:inherit;cursor:pointer}.opt.sel{border-color:var(--pr)}.opt.ok{border-color:var(--ok)}.opt.bad{border-color:var(--bad)}
.ring{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;margin:auto}.ring span{background:var(--card);width:98px;height:98px;border-radius:50%;display:grid;place-items:center;font-size:26px;font-weight:700}
.chat{max-height:360px;overflow:auto;margin-bottom:10px}.m{padding:10px 12px;border-radius:14px;margin:6px 0;max-width:88%}.m.u{background:var(--pr);color:#fff;margin-left:auto}.m.a{background:var(--bg);border:1px solid var(--bd)}
.flip{min-height:190px;display:grid;place-items:center;text-align:center;font-size:18px;cursor:pointer;background:linear-gradient(135deg,color-mix(in srgb,var(--pr) 12%,var(--card)),var(--card))}
#ldw{position:fixed;inset:0;background:rgba(10,12,30,.55);display:none;place-items:center;z-index:20;align-items:center;justify-content:center;color:#fff;flex-direction:column;gap:12px}.spin{width:42px;height:42px;border:4px solid #fff5;border-top-color:#fff;border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:30;max-width:90%}
.empty{text-align:center;padding:30px 10px;color:var(--mu)}.empty b{font-size:40px;display:block}.hero{text-align:center;padding:60px 10px}.logo{font-size:56px}canvas{max-width:100%;border:1px solid var(--bd);border-radius:10px}.clk{cursor:pointer}
body.auth{background:radial-gradient(1000px 500px at 50% -10%,color-mix(in srgb,var(--pr2) 12%,transparent),transparent),var(--bg)}
.splash{position:fixed;inset:0;z-index:15;background:radial-gradient(circle at 50% 30%,#1c2b45,#0b1220 70%);color:#e8edf5;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.splash .mark{width:96px;height:96px;border-radius:26px;display:grid;place-items:center;font-size:44px;background:#ffffff10;border:1px solid #ffffff22;box-shadow:0 0 60px #4f8fb455;margin-bottom:22px}
.splash h1{font-size:34px;margin:0}.splash h1 span{color:#7fb7c4}.splash p{color:#9fb0c7;margin:6px 0 22px}
.chips2{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.chips2 i{font-style:normal;font-size:12px;border:1px solid #ffffff22;border-radius:99px;padding:5px 12px;color:#c5d2e4}
.splash .ld{position:absolute;bottom:40px;left:24px;right:24px;max-width:420px;margin:auto}@keyframes fill{from{width:0}}
.aw{min-height:80vh;display:grid;place-items:center}.ac{width:100%;max-width:420px;background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:28px;box-shadow:0 20px 50px rgba(15,23,42,.08)}
.ac h2{margin:10px 0 2px;font-size:24px;text-align:center}.ac>p.mu{text-align:center}.ac label{font-size:12px;font-weight:600;color:var(--mu)}.lg{width:52px;height:52px;border-radius:14px;background:var(--pr);display:grid;place-items:center;margin:0 auto;font-size:26px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin:16px 0}.seg button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-weight:600;padding:8px;border-radius:9px;cursor:pointer}.seg .on{background:var(--card);color:var(--tx);box-shadow:0 1px 4px rgba(15,23,42,.1)}
.btn.w{width:100%;padding:13px}.c{text-align:center}.step{font-size:11px;letter-spacing:.08em;color:var(--mu);font-weight:700;margin-bottom:6px}
.ch{display:inline-block;border:1.5px solid var(--bd);border-radius:12px;padding:9px 14px;margin:0 6px 8px 0;cursor:pointer;background:var(--bg);font-size:14px}.ch.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.oc{display:flex;gap:12px;align-items:center;border:1.5px solid var(--bd);border-radius:14px;padding:12px;margin:8px 0;cursor:pointer}.oc.on{border-color:var(--pr);background:color-mix(in srgb,var(--pr) 7%,transparent)}.oc b{display:block}.oc small{color:var(--mu)}
.hero2{background:linear-gradient(135deg,#17294a,#25506b);color:#fff;border-radius:20px;padding:22px;margin-bottom:14px}.hero2 h1{margin:2px 0 6px;color:#fff}.mu2{opacity:.7;font-size:13px}
</style></head><body>
<div id="nav"></div><div id="main"></div><div id="ldw"><div class="spin"></div><div id="ld"></div></div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>'),uid=()=>Math.random().toString(36).slice(2,9);
let S;try{S=JSON.parse(localStorage.getItem('sw'))}catch(e){}
S=S||{users:[],cur:null,subjects:[],min:70,plan:null};
const save=()=>{try{localStorage.setItem('sw',JSON.stringify(S))}catch(e){toast('Storage is full - delete old lectures')}};
let V={v:'splash'},smp=null,DOC={},tab={},ex=null,pr=null;
const toast=m=>{const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),3500)};
const go=(v,p={})=>{V={v,...p};render()};
const SU=()=>S.subjects.find(x=>x.id===V.s),LE=()=>SU()?.lectures.find(x=>x.id===V.l);
const allL=()=>S.subjects.flatMap(s=>s.lectures.map(l=>({s,l})));
const last=L=>L.exams[L.exams.length-1],weak=L=>{const a=last(L);return a?Object.entries(a.topics).filter(([k,v])=>v.c/v.t<.7).map(([k])=>k):[]};
const LP=L=>(L.studied?25:0)+(L.exams.length?25:0)+(L.done?50:0),SP=s=>s.lectures.length?Math.round(s.lectures.reduce((a,l)=>a+LP(l),0)/s.lectures.length):0;
const pill=(t,c='')=>`<span class="pill ${c}">${esc(t)}</span>`,bar=(p,c='')=>`<div class="bar"><i class="${c}" style="width:${Math.max(0,Math.min(100,p))}%"></i></div>`;
const stat=L=>L.done?pill('Completed','ok'):last(L)?pill('Needs review','bad'):L.studied?pill('Ready for exam','wa'):pill('New');
const empty=(i,t,b='')=>`<div class="empty"><b>${i}</b>${t}<br>${b}</div>`;
const ctx=L=>L.pages.map((t,i)=>`[Page ${i+1}] ${t}`).join('\n').slice(0,16000);
const SRC='RULES: Use ONLY the lecture text below as the source. If something is not in the lecture, say so explicitly. Never claim to know real exam questions - questions are predictions from the lecture only. Explain simply with examples. Cite pages as given in [Page N].\nLECTURE:\n';
async function ai(p){if(!smp)smp=await (window.claude?.use('sample'));if(!smp)throw Error('AI is unavailable in this view');return smp.json((S.mode?'Preferred explanation style: '+S.mode+'. ':'')+p+'\nReturn ONLY valid JSON, no markdown.',{cache:false})}
async function run(msg,fn){$('ld').textContent=msg;$('ldw').style.display='flex';try{return await fn()}catch(e){toast(e.message||e.code||'Something went wrong')}finally{$('ldw').style.display='none'}}
// ---------- auth ----------
function doReg(){const n=$('n').value.trim(),e=$('e').value.trim().toLowerCase(),p=$('p').value;if(!n||!e||p.length<4)return toast('Enter name, email and a 4+ char password');if(S.users.find(u=>u.e==e))return toast('Email already registered');S.users.push({n,e,p});S.cur=e;save();go('onb1')}
function doLog(){const u=S.users.find(u=>u.e==$('e').value.trim().toLowerCase()&&u.p==$('p').value);if(!u)return toast('Wrong email or password');S.cur=u.e;save();go('home')}
const me=()=>S.users.find(u=>u.e==S.cur)||{n:'Student',e:''};
// ---------- subjects / upload ----------
function addSub(){const n=$('sn').value.trim();if(!n)return toast('Name the subject');S.subjects.push({id:uid(),name:n,lectures:[]});save();render()}
function delSub(id){if(confirm('Delete this subject and all its lectures?')){S.subjects=S.subjects.filter(s=>s.id!=id);save();go('subjects')}}
function delLec(){if(confirm('Delete this lecture?')){SU().lectures=SU().lectures.filter(l=>l.id!=V.l);save();go('subject',{s:V.s})}}
async function upload(){const f=$('pf').files[0],txt=$('pt').value.trim(),title=$('lt').value.trim()||(f?f.name.replace(/\.pdf$/i,''):'Untitled lecture');if(!f&&!txt)return toast('Choose a PDF or paste lecture text');
 const id=uid();const L=await run('Reading the lecture…',async()=>{let pages=[];
  if(f){pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const d=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;DOC[id]=d;for(let i=1;i<=d.numPages;i++){const c=await(await d.getPage(i)).getTextContent();pages.push(c.items.map(x=>x.str).join(' ').replace(/\s+/g,' ').trim())}}
  else{for(let i=0;i<txt.length;i+=1800)pages.push(txt.slice(i,i+1800))}
  if(pages.join('').length<60)throw Error('No readable text found (scanned PDF?). Paste the text instead.');
  $('ld').textContent='AI is analyzing the lecture…';
  const r=await ai(SRC+ctx({pages})+'\nAnalyze this lecture. JSON: {"topics":[{"name":"","page":1}] (5-10 main topics),"summary":{"key_points":[""],"definitions":[{"term":"","def":""}],"concepts":[{"name":"","explain":""}],"formulas":[""],"examples":[""],"exam_notes":[""]}}');
  return{id,title,pages,topics:r.topics||[],summary:r.summary||{},imp:null,pot:null,cards:null,chat:[],exams:[],studied:false,reviewed:{},practiced:{},done:false}});
 if(L){SU().lectures.push(L);save();go('lecture',{s:V.s,l:id})}}
// ---------- lecture generators ----------
const G={imp:['Generate 8-12 important questions with short model answers from this lecture. JSON: {"items":[{"q":"","a":"","level":"Very Important|Important|Review","page":1}]}','Finding important questions…'],
pot:['Generate 8-10 POTENTIAL exam questions (predictions based only on this lecture) mixing MCQ, True/False, Short Answer, Compare, Define and Problem-solving where suitable. JSON: {"items":[{"q":"","type":"MCQ|True/False|Short Answer|Compare|Define|Problem","options":[],"a":"model answer","topic":"","page":1}]}','Predicting potential questions…'],
cards:['Generate 12 study flashcards. JSON: {"items":[{"front":"","back":"","topic":""}]}','Creating flashcards…']};
async function gen(k){const L=LE();const r=await run(G[k][1],()=>ai(SRC+ctx(L)+'\n'+G[k][0]));if(r?.items?.length){L[k]=r.items;save();render()}else if(r)toast('No result, try again')}
function setTab(t){tab[V.l]=t;render()}
function studied(){LE().studied=true;save();toast('Marked as studied. You can take the exam now.');render()}
async function ask(){const L=LE(),q=$('q').value.trim();if(!q)return;L.chat.push({r:'u',t:q});$('q').value='';render();
 const h=L.chat.slice(-7,-1).map(m=>(m.r=='u'?'Student: ':'AI: ')+m.t).join('\n');
 const r=await run('Thinking…',()=>ai(SRC+ctx(L)+'\nCHAT SO FAR:\n'+h+'\nQuestion: '+q+'\nAnswer simply with an example. If the answer is not in the lecture set found=false, say so first, then add a brief clearly-labelled general explanation. JSON: {"answer":"","found":true,"pages":[1]}'));
 L.chat.push(r?{r:'a',t:r.answer,found:r.found!==false,pages:r.pages||[]}:{r:'a',t:'Sorry, I could not answer. Try again.',found:true,pages:[]});save();render();const c=$('chat');if(c)c.scrollTop=1e5}
// ---------- exam ----------
const cfg={n:10,d:'Mixed'};
async function startExam(){const L=LE();const prev=L.exams.flatMap(a=>a.qs.map(q=>q.q)).slice(-30).join(' | ');
 const r=await run('Generating your exam…',()=>ai(SRC+ctx(L)+`\nCreate an exam of exactly ${cfg.n} questions, difficulty: ${cfg.d}. Mix types: mcq (4 options), tf (options ["True","False"]) and short (short answer, define, compare or small problem; answerable in 1-3 sentences). ${prev?'Questions MUST be new and different from: '+prev:''}\nEach "topic" must be one of: ${L.topics.map(t=>t.name).join('; ')}. JSON: {"qs":[{"type":"mcq|tf|short","q":"","options":[],"answer":"exact option text for mcq, True/False for tf, model answer for short","explanation":"","topic":"","page":1}]}`));
 if(r?.qs?.length){ex={l:L.id,qs:r.qs,i:0,ans:[]};go('exam',{s:V.s,l:V.l})}}
function pick(v){ex.ans[ex.i]=v;render()}
const nav=d=>{ex.i+=d;render()};
async function submitExam(){const L=LE(),un=ex.qs.filter((q,i)=>!ex.ans[i]).length;if(un&&!confirm(un+' unanswered question(s) will count as wrong. Submit?'))return;
 const a=await run('AI is grading and analyzing your answers…',async()=>{
  const qs=ex.qs.map((q,i)=>({...q,mine:ex.ans[i]||'',ok:q.type=='short'?null:(ex.ans[i]||'')==q.answer}));
  let an='';try{const sh=qs.map((q,i)=>({i,q:q.q,model:q.answer,student:q.mine,type:q.type})).filter(x=>x.type=='short'&&x.student);
   const r=await ai(`Grade the student's short answers (correct if essentially matches the model answer) and analyze performance.\nQuestions: ${JSON.stringify(qs.map((q,i)=>({i,type:q.type,q:q.q,topic:q.topic,student:q.mine,answer:q.answer,ok:q.ok})))}\nJSON: {"grades":[{"i":0,"ok":true,"feedback":"one short sentence"}] (only for type short),"analysis":"3-5 sentences: strengths, what went wrong and what to review"}`);
   (r.grades||[]).forEach(g=>{if(qs[g.i]){qs[g.i].ok=!!g.ok;qs[g.i].fb=g.feedback}});an=r.analysis||''}catch(e){}
  qs.forEach(q=>{if(q.ok===null){const kw=q.answer.toLowerCase().split(/\W+/).filter(w=>w.length>4);q.ok=!!q.mine&&kw.length>0&&kw.filter(w=>q.mine.toLowerCase().includes(w)).length/kw.length>=.5}});
  const t={};qs.forEach(q=>{const k=q.topic||'General';t[k]=t[k]||{c:0,t:0};t[k].t++;if(q.ok)t[k].c++});
  const c=qs.filter(q=>q.ok).length;return{date:Date.now(),n:qs.length,diff:cfg.d,c,pct:Math.round(c/qs.length*100),qs,topics:t,analysis:an}});
 if(a){L.exams.push(a);if(a.pct>=S.min&&L.studied)L.done=true;L.reviewed={};save();ex=null;go('result',{s:V.s,l:V.l})}}
// ---------- weak topics / practice ----------
function pageFor(L,t){const q=last(L)?.qs.find(q=>q.topic==t&&!q.ok);return q?.page||L.topics.find(x=>x.name==t)?.page||1}
async function explain(t){const L=LE();const r=await run('Re-explaining simply…',()=>ai(SRC+ctx(L)+`\nThe student is weak in "${t}". Re-explain it very simply based on the lecture. JSON: {"explanation":"","example":"","analogy":"","remember":["short bullets"]}`));if(r){L.exp=L.exp||{};L.exp[t]=r;L.reviewed[t]=true;save();render()}}
async function practice(t){const L=LE();const r=await run('Creating practice questions…',()=>ai(SRC+ctx(L)+`\nCreate 5 new multiple-choice practice questions only about "${t}". JSON: {"qs":[{"q":"","options":["","","",""],"answer":"exact option text","explanation":""}]}`));if(r?.qs?.length){pr={t,qs:r.qs,ans:[]};go('practice',{s:V.s,l:V.l,t})}}
function prAns(i,o){if(pr.ans[i]!=null)return;pr.ans[i]=o;render()}
function prDone(){const L=LE(),c=pr.qs.filter((q,i)=>pr.ans[i]==q.options[q.answerIdx]||pr.ans[i]==q.answer).length;if(c/pr.qs.length>=.8){L.practiced[pr.t]=L.reviewed[pr.t]=true;save();toast('Great! Topic practiced ✓')}else toast('Score '+c+'/'+pr.qs.length+' - review once more and retry');go('weak',{s:V.s,l:V.l,t:pr.t})}
async function plan(){const d=allL().map(({s,l})=>({subject:s.name,lecture:l.title,studied:l.studied,done:l.done,last:last(l)?.pct,weak:weak(l)}));
 const r=await run('Building your study plan…',()=>ai(`Create a practical 5-day study plan and 3 tips for this student. Data: ${JSON.stringify(d)}. Min passing score ${S.min}%. JSON: {"days":[{"day":"Day 1","tasks":[""]}],"tips":[""]}`));if(r){S.plan=r;save();render()}}
// ---------- views ----------
const topicStats=()=>{const m={};allL().forEach(({l})=>{const a=last(l);a&&Object.entries(a.topics).forEach(([k,v])=>{m[k]=m[k]||{c:0,t:0};m[k].c+=v.c;m[k].t+=v.t})});return Object.entries(m).map(([k,v])=>({k,p:Math.round(v.c/v.t*100)}))};
const subCard=s=>`<div class="card clk" onclick="go('subject',{s:'${s.id}'})"><h3>📘 ${esc(s.name)}</h3><div class="mu">${s.lectures.length} lecture(s) · ${s.lectures.filter(l=>l.done).length} completed</div>${bar(SP(s))}<div class="mu">${SP(s)}% progress</div></div>`;
const VIEWS={
splash:()=>`<div class="hero"><div class="logo">🎓</div><h1>StudyWise AI</h1><p class="mu">Your personal AI study & exam assistant</p><div class="spin" style="margin:20px auto;border-color:var(--bd);border-top-color:var(--pr)"></div></div>`,
login:()=>`<div class="card" style="max-width:380px;margin:40px auto"><div class="logo" style="text-align:center">🎓</div><h1 style="text-align:center">Welcome back</h1><input id="e" placeholder="Email" type="email"><input id="p" placeholder="Password" type="password"><button class="btn" style="width:100%" onclick="doLog()">Log in</button><p class="mu" style="text-align:center">New here? <a href="#" onclick="go('register');return false">Create account</a></p></div>`,
register:()=>`<div class="card" style="max-width:380px;margin:40px auto"><h1 style="text-align:center">Create account</h1><input id="n" placeholder="Your name"><input id="e" placeholder="Email" type="email"><input id="p" placeholder="Password (4+ chars)" type="password"><button class="btn" style="width:100%" onclick="doReg()">Register</button><p class="mu" style="text-align:center"><a href="#" onclick="go('login');return false">Back to login</a></p></div>`,

 ${a.analysis?`<div class="card"><h3>🤖 AI analysis</h3>${md(a.analysis)}</div>`:''}<h2>Topic performance</h2><div class="card">${Object.entries(a.topics).map(([k,v])=>`<div class="row sp"><span>${esc(k)}</span><span class="mu">${v.c}/${v.t}</span></div>${bar(v.c/v.t*100,v.c/v.t>=.7?'ok':'bad')}<div style="height:8px"></div>`).join('')}</div>

 <h2>By subject</h2>${S.subjects.map(s=>`<div class="card"><div class="row sp"><b>${esc(s.name)}</b><span>${SP(s)}%</span></div>${bar(SP(s))}${s.lectures.map(l=>`<div class="row sp mu" style="margin-top:6px"><span>${esc(l.title)}</span><span>${l.exams.length?last(l).pct+'%':'—'} ${stat(l)}</span></div>`).join('')}</div>`).join('')||empty('📈','No data yet')}

 <h2>Study plan</h2><div class="card">${S.plan?planHtml():'<span class="mu">No plan yet.</span>'}<div style="margin-top:8px"><button class="btn s" onclick="plan()" ${A.length?'':'disabled'}>✨ ${S.plan?'Regenerate':'Generate'} plan</button></div></div>`},

const PRE=['Database Systems','Data Structures & Algorithms','Computer Networks','Operating Systems','Discrete Mathematics'],LV=['Undergraduate','Graduate / Master','Medical / Law','High School / AP'],GO=[[90,'Ace Top 5%','Target 90% and above'],[80,'Solid Mastery','Target 80% - 89%'],[70,'Efficient Pass','Core competencies 70%+']],MO=[['Conceptual & Analogies','Translates dense topics into mental metaphors and real-life examples'],['Direct & Formulaic','Compact bullet points, formulas and exam-style notation'],['Socratic & Inquisitive','Guides you with questions and hints to force active recall']];
const tabsA=a=>`<div class="seg"><button class="${a=='l'?'on':''}" onclick="go('login')">Sign in</button><button class="${a=='r'?'on':''}" onclick="go('register')">Create account</button></div>`,prog=n=>`<div class="step">STEP ${n} OF 2</div>${bar(n*50)}`;
function tgC(i){const x=OBC[i];OB.cs=OB.cs.includes(x)?OB.cs.filter(y=>y!=x):[...OB.cs,x];render()}
function addC(){const v=$('cc').value.trim();if(v&&!OB.cs.includes(v))OB.cs.push(v);render()}
function fin(){S.min=OB.goal;S.mode=OB.mode;S.daily=OB.daily;OB.cs.forEach(n=>{if(!S.subjects.find(s=>s.name==n))S.subjects.push({id:uid(),name:n,lectures:[]})});save();go('home')}
VIEWS.splash=()=>`<div class="splash"><div class="mark">🎓</div><h1>StudyWise <span>AI</span></h1><p>Your Personal AI Study & Exam Assistant</p><div class="chips2"><i>Study Smarter</i><i>Understand Deeper</i><i>Improve Continuously</i></div><div class="ld"><div class="row sp mu"><span>Cognitive workspace ready</span><span>100%</span></div><div class="bar"><i style="animation:fill 1.3s"></i></div></div></div>`;
VIEWS.login=()=>`<div class="aw"><div class="ac"><div class="lg">🎓</div><h2>Welcome back</h2><p class="mu">Sign in to continue your intelligent study journey</p>${tabsA('l')}<label>ACADEMIC EMAIL</label><input id="e" type="email" placeholder="student@university.edu"><label>PASSWORD</label><input id="p" type="password" placeholder="••••••••" onkeydown="if(event.key=='Enter')doLog()"><button class="btn w" onclick="doLog()">Sign in to StudyWise →</button><p class="mu c" style="margin-bottom:0">🔒 Your data stays on this device</p></div></div>`;
VIEWS.register=()=>`<div class="aw"><div class="ac"><div class="lg">🎓</div><h2>Create your account</h2><p class="mu">Start studying smarter in under a minute</p>${tabsA('r')}<label>FULL NAME</label><input id="n" placeholder="Your name"><label>ACADEMIC EMAIL</label><input id="e" type="email" placeholder="student@university.edu"><label>PASSWORD</label><input id="p" type="password" placeholder="4+ characters"><button class="btn w" onclick="doReg()">Create account →</button></div></div>`;
VIEWS.onb1=()=>{OBC=[...new Set([...PRE,...OB.cs])];return`<div class="aw"><div class="ac" style="max-width:520px">${prog(1)}<h2 style="text-align:left">What are you studying this term?</h2><p class="mu" style="text-align:left">We create your subjects and tune the AI to your coursework.</p><label>ACADEMIC LEVEL</label><div style="margin:8px 0">${LV.map((x,i)=>`<span class="ch ${OB.lvl==x?'on':''}" onclick="OB.lvl=LV[${i}];render()">${x}</span>`).join('')}</div><label>DEGREE PROGRAM</label><input value="${esc(OB.deg)}" oninput="OB.deg=this.value" placeholder="e.g. Computer Science & Engineering"><label>CURRENT COURSES · ${OB.cs.length} SELECTED</label>${OBC.map((x,i)=>`<div class="oc ${OB.cs.includes(x)?'on':''}" onclick="tgC(${i})"><span>${OB.cs.includes(x)?'✅':'⬜'}</span><b>${esc(x)}</b></div>`).join('')}<div class="row"><input id="cc" placeholder="Add custom subject" style="flex:1;margin:0"><button class="btn g" onclick="addC()">＋</button></div><div class="row sp" style="margin-top:18px"><button class="btn g" onclick="go('home')">Skip</button><button class="btn" onclick="go('onb2')">Continue →</button></div></div></div>`};
VIEWS.onb2=()=>`<div class="aw"><div class="ac" style="max-width:520px">${prog(2)}<h2 style="text-align:left">How do you learn best?</h2><label>TARGET BENCHMARK (PASS MARK)</label>${GO.map(g=>`<div class="oc ${OB.goal==g[0]?'on':''}" onclick="OB.goal=${g[0]};render()"><span>${OB.goal==g[0]?'🔘':'⚪'}</span><div><b>${g[1]}</b><small>${g[2]}</small></div></div>`).join('')}<label>AI TUTOR EXPLANATION MODE</label>${MO.map((m,i)=>`<div class="oc ${OB.mode==m[0]?'on':''}" onclick="OB.mode=MO[${i}][0];render()"><span>${OB.mode==m[0]?'🔘':'⚪'}</span><div><b>${m[0]}</b><small>${m[1]}</small></div></div>`).join('')}<label>DAILY COMMITMENT</label><div style="margin-top:8px">${[30,60,120].map(d=>`<span class="ch ${OB.daily==d?'on':''}" onclick="OB.daily=${d};render()">${d<60?d+' min':d/60+' hr'}</span>`).join('')}</div><div class="row sp" style="margin-top:14px"><button class="btn g" onclick="go('onb1')">Back</button><button class="btn" onclick="fin()">Launch dashboard →</button></div></div></div>`;
render();setTimeout(()=>go(S.cur&&S.users.find(u=>u.e==S.cur)?'home':'login'),1400);
</script></body></html>
